packages:
  - apps/*
  - config
  - dyhub-client
  - local-storage
  - site

# Shared tool versions; reference them with "catalog:" in any package.json.
catalog:
  '@eslint/js': ^10.0.1
  '@playwright/test': ^1.63.0
  '@types/node': ^26.6.3
  eslint: ^10.11.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.13.0
  jest: ^30.5.2
  jest-environment-jsdom: ^30.5.2
  prettier: ^3.9.9
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  vite: ^8.3.2

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  unrs-resolver: true
