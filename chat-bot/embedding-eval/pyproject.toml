[project]
name = "dy-apps-chat-bot-embedding-eval"
version = "0.1.0"
description = "Which local embedding model best recalls the right Chinese room memory for what is being said in a live room: a character-bigram BM25 baseline vs Qwen3-Embedding-0.6B / 4B and bge-m3."
requires-python = ">=3.11,<3.14"
dependencies = [
  "huggingface_hub",
  "numpy",
  "psutil",
  "pypinyin",
  "sentence-transformers>=5.0",
  "torch>=2.4",
  "transformers>=4.51",
]

[tool.uv]
package = false
