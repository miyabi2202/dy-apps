[project]
name = "dy-apps-chat-bot-asr"
version = "0.1.0"
description = "Live transcription worker for the chat bot: ffmpeg + fsmn-vad + FireRedLID + FireRedASR2-AED or SenseVoiceSmall + AST + ERes2Net voiceprints, with Demucs splitting the vocals for Shazam."
requires-python = ">=3.11,<3.14"
dependencies = [
  "audioop-lts>=0.2.2 ; python_full_version >= '3.13'",
  "demucs>=4.0",
  "fireredasr2s",
  "funasr>=1.2",
  "huggingface_hub",
  # FireRedASR2's feature extractor uses it but its package doesn't list it.
  "kaldi_native_fbank>=1.15",
  # ERes2Net's checkpoint comes from ModelScope (FunASR depends on it too).
  "modelscope",
  "numpy",
  "shazamio>=0.8.1",
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.40",
]

[tool.uv.sources]
# Not on PyPI; pinned to a commit.
fireredasr2s = { git = "https://github.com/FireRedTeam/FireRedASR2S", rev = "4e7d9aaf4482a47cec1724807026b9b151926eb5" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# fireredasr2s pins exact versions of these (torch==2.10.0, …); ours win.
override-dependencies = ["torch>=2.4", "torchaudio>=2.4", "transformers>=4.40", "numpy"]
